<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Hasira Transport - ئۆفلاین</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf0f8,#dce7f4);color:#172033;font-family:Tahoma,Arial,sans-serif}.card{width:min(440px,100%);padding:38px;border:1px solid #cbd6e4;border-radius:26px;background:#fff;box-shadow:0 28px 80px rgba(30,55,90,.18);text-align:center}.icon{display:grid;place-items:center;width:86px;height:86px;margin:0 auto 22px;border-radius:50%;background:#fff7ed;color:#d97706;font-size:38px}h1{font-size:24px;margin:0 0 12px}p{color:#64748b;line-height:1.9;margin:0}.retry{display:block;width:100%;margin-top:24px;padding:13px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}</style></head>
<body><main class="card"><div class="icon">!</div><h1>ئینتەرنێت بەردەست نییە</h1><p>بۆ بەکارهێنانی سیستەمی ئۆفلاین، پێویستە یەک جار لاپەڕەی کۆنترۆڵی دەروازەت بە ئۆنلاین کردبێتەوە.</p><button class="retry" onclick="location.reload()">دووبارە هەوڵبدەوە</button></main></body></html>
